name: Java CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Permissão Maven
        run: chmod +x mvnw

      # inclui os testes no Postgres real (Testcontainers usa o Docker do runner)
      - name: Build
        run: ./mvnw clean package -Dspring.profiles.active=test

  segredos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # mesma versão usada para verificar o histórico localmente
          GITLEAKS_VERSION: 8.21.2
