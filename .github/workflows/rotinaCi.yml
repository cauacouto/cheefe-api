name: Java CI

on:
  push:
    branches:
      - main


jobs:
  build:

    runs-on: ubuntu-latest

    env:
      RESEND_API_KEY: ${{ secrets_RESEND_API_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Permissão Maven
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw clean package