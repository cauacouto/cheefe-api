spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: teste-client-id
            client-secret: teste-secret
            scope: openid,profile,email

storage:
  endpoint: http://localhost:9000
  bucket: teste
  access-key: teste
  secret-key: teste
  public-url: http://localhost:9000/teste

jwt:
  key: teste

moderacao:
  emails: moderacao@chefhome.test

app:
  front-url: http://localhost:5173

auth:
  cookie:
    secure: false

# a rotina do ciclo do agendamento não roda sozinha nos testes (eles chamam processar() direto)
chefhome:
  rotina:
    cron: "-"
    aviso-um-ano:
      cron: "-"
  # verificação de telefone falsa (código 000000), pedida explicitamente: os testes do fluxo /telefone usam
  telefone:
    verificador-falso: true
