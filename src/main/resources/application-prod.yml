# Perfil de produção (SPRING_PROFILES_ACTIVE=prod). Só referências a variáveis de ambiente:
# nenhum valor real entra neste arquivo. A lista completa das variáveis está no README.

spring:
  datasource:
    # Usuário da API = chefhome_app (só SELECT/INSERT/UPDATE/DELETE). Nunca o chefhome_migracao.
    # Ex.: jdbc:postgresql://host:5432/chefe_api?currentSchema=chefhome
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        # o detalhe do erro do Postgres repete os valores da linha (ex.: telefone no índice único): fora do log
        logServerErrorDetail: false

  jpa:
    hibernate:
      # O schema vem das migrations do Flyway (passo separado, antes do deploy).
      # A API só confere: se o schema divergir das entidades, ela não sobe.
      ddl-auto: validate

  servlet:
    multipart:
      # o validador de imagem aceita até 5MB; sem isso o Spring corta em 1MB
      max-file-size: 5MB
      max-request-size: 6MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email

server:
  # Atrás de proxy/PaaS que termina TLS: sem isso o redirect_uri sai como http:// e o Google
  # responde redirect_uri_mismatch.
  forward-headers-strategy: framework

# Chave HMAC dos JWTs da API e base (PBKDF2) da cifra AES do cookie do fluxo OAuth.
# Use um valor aleatório longo, ex.: openssl rand -base64 48
jwt:
  key: ${JWT_KEY}

# E-mails (separados por vírgula) que entram como moderação ao logar com o Google.
# Moderadores não existem no banco; tirar um e-mail daqui derruba a sessão dele na hora.
moderacao:
  emails: ${MODERACAO_EMAILS:}

# Fotos de pratos e de perfil: bucket compatível com S3 (Cloudflare R2, AWS S3, MinIO...).
storage:
  endpoint: ${R2_ENDPOINT}
  bucket: ${R2_BUCKET}
  access-key: ${R2_ACCESS_KEY_ID}
  secret-key: ${R2_SECRET_ACCESS_KEY}
  public-url: ${R2_PUBLIC_URL}

# Para onde o BFF redireciona depois do login (sem barra no final).
app:
  front-url: ${FRONT_URL:http://localhost:5173}

# false só em desenvolvimento local via HTTP.
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

# Verificação de telefone por SMS (Twilio Verify). Em prod, sem as três chaves ou sem o pepper a API não sobe;
# fora de prod, sem nenhuma das chaves, o código é sempre 000000 (nenhum SMS sai).
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}

chefhome:
  telefone:
    # Segredo do hash dos telefones banidos (openssl rand -base64 32). Trocar depois esvazia a lista de banidos.
    pepper: ${CHEFHOME_PEPPER_TELEFONE:}
