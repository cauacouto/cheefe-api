spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: teste-client-id
            client-secret: teste-secret
            scope: openid,profile,email

cloudinary:
  cloud-name: teste
  api-key: teste
  api-secret: teste

jwt:
  key: teste

app:
  front-url: http://localhost:5173

auth:
  cookie:
    secure: false
